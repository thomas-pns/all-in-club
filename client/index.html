<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#231A3B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS 26/27 : avec « black-translucent », l'appli de l'écran d'accueil calcule mal sa hauteur
       (bande vide en bas). Même réglage que Parlotte : barre d'état « default » et appli à 100 % en CSS. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="All-In Club">
  <meta name="description" content="Poker Texas Hold'em entre amis, en ligne ou en solo contre des bots.">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icone-180.png">
  <title>All-In Club</title>
  <script>
    if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
